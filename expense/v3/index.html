*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fb;color:#192638;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}input,select{font-size:16px!important;width:100%;padding:10px;border:1px solid #d6dfeb;border-radius:10px;background:#fff;min-height:43px}.app{height:100dvh;height:100svh;max-width:650px;margin:auto;background:white;overflow:hidden;display:flex;flex-direction:column}.page{flex:1;min-height:0;display:flex;flex-direction:column}.hide{display:none!important}#home::before{content:"";display:block;flex:none;height:20%;background:white}.entry{height:64%;flex:none;padding:8px 16px 4px;overflow:hidden;display:flex;flex-direction:column}.nav{height:16%;flex:none;padding:8px 16px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #e3e7ee}.nav button{border:1px solid #dce4ee;border-radius:15px;background:#f5f8fc;font-weight:700;font-size:17px}.entry h1{font-size:19px;margin:0 0 8px}.field{margin-bottom:10px}.labelrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-weight:700}.edit{background:none;border:0;color:#2462c3;padding:5px;font-size:13px}.cash{display:flex;align-items:center;gap:8px}.cash strong{font-size:21px}.cash input{font-size:22px!important;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.cat{border:1px solid #d7deeb;background:white;border-radius:10px;padding:10px 2px;min-height:40px;font-weight:600;font-size:13px;overflow-wrap:anywhere}.cat.on{background:#e8f0ff;border-color:#2869c7;color:#1a56ab}.primary{background:#225ec3;color:white;border:0;border-radius:11px;min-height:44px;font-weight:700;width:100%}.primary:disabled{opacity:.4}.grow{flex:1;min-height:0}.heading{height:62px;flex:none;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e6ee;padding:10px 14px}.heading h1{margin:0;font-size:18px}.back{border:1px solid #e1e4ed;border-radius:9px;background:white;min-height:38px;min-width:40px;font-size:20px}.content{overflow:auto;min-height:0;flex:1;padding:15px 14px 35px;overscroll-behavior:contain}.secondary{background:white;border:1px solid #d7dfea;border-radius:10px;padding:10px;color:#1759bd}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.item{padding:12px 0;border-bottom:1px solid #edf0f5;display:flex;align-items:center;gap:10px}.item span{flex:1;overflow-wrap:anywhere}.muted{color:#697588;font-size:12px}.danger{color:#bb394d}.box{border:1px solid #e0e5ee;border-radius:13px;padding:14px;margin-bottom:12px}.tablewrap{overflow-x:auto;border:1px solid #e0e5ef;border-radius:10px}.table{border-collapse:collapse;min-width:580px;width:100%;table-layout:fixed}.table th,.table td{padding:12px 7px;text-align:left;border-bottom:1px solid #e8edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.table th{background:#f7f9fc}.table td:nth-child(3){text-align:right}.table tr[data-id]{cursor:pointer}.range{display:flex;align-items:center;gap:6px;margin:0 0 12px}.range input{min-width:0;font-size:16px!important;padding:6px}.donut{width:190px;height:190px;border-radius:50%;margin:12px auto;display:grid;place-items:center}.hole{width:120px;height:120px;border-radius:50%;background:white;display:grid;place-items:center;font-weight:700;font-size:18px}.bar{width:100%;text-align:left;border:0;border-bottom:1px solid #e8ecf3;padding:10px 0;background:white}.track{height:16px;background:#edf1f6;border-radius:4px;overflow:hidden;margin-top:6px}.fill{height:100%}.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.stack{display:grid;gap:9px}.btnrow{display:flex;gap:10px}.btnrow>*{flex:1}.overlay{position:fixed;inset:0;background:#19233488;display:grid;place-items:end center;z-index:5}.sheet{width:100%;max-width:650px;max-height:90dvh;overflow:auto;background:white;border-radius:20px 20px 0 0;padding:18px 16px max(24px,env(safe-area-inset-bottom))}.sheet h2{margin:0 0 16px;font-size:18px}.sheet label{display:block;margin:12px 0 5px;font-weight:700}.note{font-size:12px;color:#6c788a;line-height:1.6}#toast{font-size:12px;color:#16724e;text-align:center;min-height:18px}#saveWarning{color:#a63b28;font-size:12px}button:active{opacity:.75}@media(max-height:720px){.entry{padding-top:7px}.field{margin-bottom:7px}.cat{padding:7px 2px;min-height:35px}.entry h1{margin-bottom:4px}}
</style></head><body><main class="app">
<section class="page" id="home"><div class="entry"><div id="saveWarning" class="hide">保存できません。Safariで開き直してください。</div><form id="entryForm" class="grow" style="display:flex;flex-direction:column"><div class="field"><div class="labelrow">タイトル</div><input id="title" required maxlength="100" placeholder="例：昼食"></div><div class="field"><div class="labelrow">金額</div><div class="cash"><strong>¥</strong><input id="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="0"></div></div><div class="field"><div class="labelrow">大カテゴリ <button type="button" id="editMain" class="edit">✎ 編集</button></div><div class="grid" id="catButtons"></div></div><div class="field"><div class="labelrow">小カテゴリ <button type="button" id="editSub" class="edit">✎ 編集</button></div><select id="subSelect" required></select></div><div class="grow"></div><button class="primary">登録する</button><div id="toast"></div></form></div><div class="nav"><button id="toHistory">☷　履歴</button><button id="toAnalysis">◔　分析</button></div></section>
<section class="page hide" id="history"><header class="heading"><button class="back" data-home>‹</button><h1>履歴</h1><span class="muted">新しい順</span></header><div class="content"><div class="tablewrap"><table class="table"><thead><tr><th>日付</th><th>タイトル</th><th>金額</th><th>大カテゴリ</th><th>小カテゴリ</th></tr></thead><tbody id="historyList"></tbody></table></div><p class="note">横にスクロールできます。行を押すと編集できます。</p><div class="box"><strong>バックアップ</strong><p class="note">Safariのデータを消すと支出記録も消えます。定期的に書き出してください。</p><div class="stack"><button class="secondary" id="backup" type="button">JSONバックアップ</button><button class="secondary" id="csv" type="button">CSV出力</button><button class="secondary" id="restore" type="button">JSON復元</button><input id="restoreFile" type="file" accept=".json,application/json" class="hide"></div></div></div></section>
<section class="page hide" id="analysis"><header class="heading"><button class="back" id="analysisBack">‹</button><h1 id="analysisName">分析</h1></header><div class="content"><div class="range"><input id="from" maxlength="8" inputmode="numeric" placeholder="YYYYMMDD"><span>〜</span><input id="to" maxlength="8" inputmode="numeric" placeholder="YYYYMMDD"></div><p class="muted" id="dateError"></p><div class="box"><div class="muted">期間内の支出合計</div><h2 id="sum">¥0</h2><div class="donut" id="donut"><div class="hole" id="hole"></div></div><div id="legend" class="legend"></div></div><div class="box"><strong id="barName">大カテゴリ別支出</strong><div id="bars"></div></div></div></section>
<section class="page hide" id="categories"><header class="heading"><button class="back" data-home>‹</button><h1 id="categoryTitle">カテゴリ管理</h1></header><div class="content"><div id="categoryRows"></div><button id="addCat" class="secondary" style="width:100%;margin-top:14px">＋ カテゴリを追加</button><p class="note">支出に使われているカテゴリは削除できません。</p><div class="box hide" id="categoryForm"><strong id="categoryFormTitle">カテゴリを追加</strong><input id="categoryInput" placeholder="カテゴリ名" maxlength="36" style="margin:10px 0"><p id="categoryError" class="danger"></p><div class="btnrow"><button class="secondary" id="cancelCat">キャンセル</button><button class="primary" id="saveCat">保存</button></div></div></div></section>
</main><div id="modal"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='expense-note-local-v1',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>{const d=new Date;return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')},money=n=>'¥'+Number(n).toLocaleString('ja-JP');
const base=[['食費',['外食','スーパー','コンビニ','カフェ']],['交通費',['電車','バス','タクシー']],['日用品',['消耗品','生活雑貨']],['娯楽',['旅行','映画','ゲーム']],['美容',['衣服','美容院']],['その他',['雑費','未分類']]];
const initial=()=>({categories:base.map(([name,subs])=>({id:uid(),name,subs:subs.map(name=>({id:uid(),name}))})),expenses:[]});let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||!Array.isArray(data.categories)||!Array.isArray(data.expenses))data=initial();
let mainId=data.categories[0]?.id||'',subId='',manage='main',renameId=null,analysisMain=null;
function save(){try{localStorage.setItem(key,JSON.stringify(data));$('saveWarning').classList.add('hide');return true}catch(e){$('saveWarning').classList.remove('hide');return false}}
function cat(id){return data.categories.find(x=>x.id===id)}function current(){return cat(mainId)}
function page(id){for(const el of document.querySelectorAll('main.app>.page'))el.classList.toggle('hide',el.id!==id);document.activeElement?.blur?.()}
function renderEntry(){if(!current())mainId=data.categories[0]?.id||'';$('catButtons').innerHTML=data.categories.map(c=>'<button type="button" class="cat '+(c.id===mainId?'on':'')+'" data-main="'+esc(c.id)+'">'+esc(c.name)+'</button>').join('');const subs=current()?.subs||[];if(!subs.some(x=>x.id===subId))subId='';$('subSelect').innerHTML='<option value="">小カテゴリを選択</option>'+subs.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===subId?'selected':'')+'>'+esc(s.name)+'</option>').join('')}
$('catButtons').onclick=e=>{const b=e.target.closest('[data-main]');if(b){mainId=b.dataset.main;subId='';renderEntry()}};$('subSelect').onchange=e=>subId=e.target.value;
$('entryForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),amount=Number($('amount').value);if(!title||!Number.isSafeInteger(amount)||amount<=0||!current()?.subs.some(s=>s.id===subId))return alert('入力内容を確認してください');data.expenses.push({id:uid(),title,amount,mainId,subId,date:today(),createdAt:Date.now()});if(!save()){data.expenses.pop();return alert('端末に保存できません。Safariの通常タブで開いてください')} $('title').value='';$('amount').value='';$('toast').textContent='✓ 登録しました';document.activeElement?.blur?.()};
$('toHistory').onclick=()=>{renderHistory();page('history')};$('toAnalysis').onclick=()=>{analysisMain=null;drawAnalysis();page('analysis')};document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{renderEntry();page('home')});
function renderHistory(){const sorted=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));$('historyList').innerHTML=sorted.map(x=>'<tr data-id="'+esc(x.id)+'"><td>'+esc(x.date)+'</td><td>'+esc(x.title)+'</td><td>'+money(x.amount)+'</td><td>'+esc(cat(x.mainId)?.name||'')+'</td><td>'+esc(cat(x.mainId)?.subs.find(s=>s.id===x.subId)?.name||'')+'</td></tr>').join('')||'<tr><td colspan="5">まだ支出がありません</td></tr>'}
$('historyList').onclick=e=>{const r=e.target.closest('[data-id]');if(r)editExpense(r.dataset.id)};
const modal=html=>{$('modal').innerHTML='<div class="overlay"><div class="sheet">'+html+'</div></div>'};const close=()=>$('modal').innerHTML='';
function editExpense(id){const x=data.expenses.find(e=>e.id===id);if(!x)return;modal('<div class="row between"><h2>支出を編集</h2><button class="secondary" id="closeModal">閉じる</button></div><form id="expenseEdit"><label>タイトル</label><input id="eTitle" required value="'+esc(x.title)+'"><label>金額</label><input id="eAmount" type="number" inputmode="numeric" min="1" required value="'+x.amount+'"><label>大カテゴリ</label><select id="eMain">'+data.categories.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===x.mainId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>小カテゴリ</label><select id="eSub"></select><div class="btnrow" style="margin-top:18px"><button type="button" class="secondary danger" id="delExpense">削除</button><button class="primary">保存</button></div></form>');$('closeModal').onclick=close;const subs=()=>{const c=cat($('eMain').value);$('eSub').innerHTML='<option value="">選択</option>'+(c?.subs||[]).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('')};subs();$('eSub').value=x.subId;$('eMain').onchange=subs;$('expenseEdit').onsubmit=e=>{e.preventDefault();const title=$('eTitle').value.trim(),amount=Number($('eAmount').value),m=$('eMain').value,s=$('eSub').value;if(!title||!Number.isSafeInteger(amount)||amount<1||!cat(m)?.subs.some(z=>z.id===s))return alert('入力内容を確認してください');const old={...x};Object.assign(x,{title,amount,mainId:m,subId:s});if(!save())return Object.assign(x,old),alert('保存に失敗しました');close();renderHistory()};$('delExpense').onclick=()=>{if(!confirm('この支出を削除しますか？'))return;const i=data.expenses.indexOf(x);data.expenses.splice(i,1);if(!save()){data.expenses.splice(i,0,x);return alert('保存できません')}close();renderHistory()}}
function list(){return manage==='main'?data.categories:(current()?.subs||[])}function openManage(level){manage=level;renameId=null;$('categoryForm').classList.add('hide');$('categoryTitle').textContent=level==='main'?'大カテゴリ管理':'小カテゴリ管理：'+(current()?.name||'');renderCategories();page('categories')}
$('editMain').onclick=()=>openManage('main');$('editSub').onclick=()=>openManage('sub');
function renderCategories(){$('categoryRows').innerHTML=list().map(x=>'<div class="item"><span>'+esc(x.name)+'</span><button class="secondary" data-rename="'+esc(x.id)+'">編集</button><button class="secondary danger" data-delete="'+esc(x.id)+'">削除</button></div>').join('')}
$('categoryRows').onclick=e=>{const edit=e.target.closest('[data-rename]'),del=e.target.closest('[data-delete]');if(edit){renameId=edit.dataset.rename;$('categoryInput').value=list().find(x=>x.id===renameId)?.name||'';$('categoryFormTitle').textContent='名前を変更';$('categoryError').textContent='';$('categoryForm').classList.remove('hide')}if(del){const id=del.dataset.delete,x=list().find(c=>c.id===id);if(!x)return;const used=data.expenses.some(z=>manage==='main'?z.mainId===id:z.mainId===mainId&&z.subId===id);if(used)return alert('支出に使われているため削除できません');if(manage==='main'&&x.subs.length)return alert('先に小カテゴリを削除してください');if(!confirm('「'+x.name+'」を削除しますか？'))return;const a=list(),i=a.findIndex(z=>z.id===id);a.splice(i,1);if(!save()){a.splice(i,0,x);return}if(manage==='main'&&mainId===id)mainId=data.categories[0]?.id||'';renderEntry();renderCategories()}};
$('addCat').onclick=()=>{renameId=null;$('categoryInput').value='';$('categoryError').textContent='';$('categoryFormTitle').textContent='カテゴリを追加';$('categoryForm').classList.remove('hide')};$('cancelCat').onclick=()=>$('categoryForm').classList.add('hide');
$('saveCat').onclick=()=>{const name=$('categoryInput').value.trim(),a=list();if(!name||a.some(z=>z.name===name&&z.id!==renameId))return $('categoryError').textContent='名前が空欄か、すでに存在します';const existing=a.find(z=>z.id===renameId);if(existing){const old=existing.name;existing.name=name;if(!save()){existing.name=old;return alert('保存できません')}}else{const added={id:uid(),name,...(manage==='main'?{subs:[]}:{})};a.push(added);if(!save()){a.pop();return alert('保存できません')}if(manage==='main')mainId=added.id;else subId=added.id}$('categoryForm').classList.add('hide');renderCategories();renderEntry()};
const pal=['#4285d4','#4dac9a','#ecae51','#a78bd5','#dc788d','#6e9fb6','#94aa63','#df9372'];
function validDate(v){if(!/^\d{8}$/.test(v))return false;const y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6,8),o=new Date(y,m-1,d);return o.getFullYear()===y&&o.getMonth()+1===m&&o.getDate()===d}
function drawAnalysis(){const start=$('from').value,end=$('to').value;if((start&&!validDate(start))||(end&&!validDate(end))||(start&&end&&start>end)){$('dateError').textContent='YYYYMMDDで正しい期間を入力してください';return}$('dateError').textContent='';const filtered=data.expenses.filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)&&(!analysisMain||x.mainId===analysisMain));const targets=analysisMain?(cat(analysisMain)?.subs||[]):data.categories;const values=targets.map(c=>({name:c.name,value:filtered.filter(x=>(analysisMain?x.subId:x.mainId)===c.id).reduce((s,x)=>s+x.amount,0),id:c.id})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);const total=values.reduce((a,x)=>a+x.value,0);$('analysisName').textContent=analysisMain?(cat(analysisMain)?.name||'')+'の内訳':'分析';$('sum').textContent=money(total);$('barName').textContent=analysisMain?'小カテゴリ別支出':'大カテゴリ別支出';let pct=0;const stops=values.map((x,i)=>{let a=pct;pct+=x.value/total*100;return pal[i%pal.length]+' '+a+'% '+pct+'%'});$('donut').style.background=total?'conic-gradient('+stops.join(',')+')':'#edf1f5';$('hole').textContent=total?'100%':'0%';$('legend').innerHTML=values.map((x,i)=>'<span><i class="dot" style="background:'+pal[i%pal.length]+'"></i>'+esc(x.name)+' '+Math.round(x.value/total*100)+'%</span>').join('');const top=Math.max(1,...values.map(x=>x.value));$('bars').innerHTML=values.map((x,i)=>'<button class="bar" '+(analysisMain?'disabled':'data-cat="'+esc(x.id)+'"')+'><div class="row between"><strong>'+esc(x.name)+'</strong><span>'+money(x.value)+'</span></div><div class="track"><div class="fill" style="width:'+(x.value/top*100)+'%;background:'+pal[i%pal.length]+'"></div></div></button>').join('')||'<p class="note">該当する支出はありません</p>'}
$('from').value=today().slice(0,6)+'01';$('to').value=today();$('from').oninput=drawAnalysis;$('to').oninput=drawAnalysis;$('bars').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){analysisMain=b.dataset.cat;drawAnalysis()}};$('analysisBack').onclick=()=>{if(analysisMain){analysisMain=null;drawAnalysis()}else page('home')};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('backup').onclick=()=>download('expense-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');$('csv').onclick=()=>{const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['入力日','タイトル','金額','大カテゴリ','小カテゴリ'],...data.expenses.map(x=>[x.date,x.title,x.amount,cat(x.mainId)?.name,cat(x.mainId)?.subs.find(s=>s.id===x.subId)?.name])];download('expense-'+today()+'.csv','\ufeff'+rows.map(a=>a.map(quote).join(',')).join('\r\n'),'text/csv')};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.categories)||!Array.isArray(v.expenses)||v.categories.some(c=>!c.id||!c.name||!Array.isArray(c.subs))||v.expenses.some(x=>typeof x.title!=='string'||!Number.isSafeInteger(x.amount)||typeof x.date!=='string'))throw 0;if(!confirm('現在の記録をバックアップで置き換えますか？'))return;const old=data;data=v;if(!save()){data=old;throw 0}mainId=data.categories[0]?.id||'';subId='';renderEntry();renderHistory();alert('復元しました')}catch{alert('復元できませんでした。ファイルを確認してください')}finally{e.target.value=''}};
save();renderEntry();drawAnalysis();
})();
</script></body></html>
