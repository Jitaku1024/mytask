<div id="root" style="padding:32px;font-family:-apple-system,sans-serif"><h1>まいタスク</h1><p>読み込み中です。MacのSafariまたはChromeで開いてください。</p></div>
<script>
(()=>{'use strict';
const KEY='mytask-mac-beta-v2';
const CLOUD_CONFIG_KEY='mytask-v07-supabase', SESSION_KEY='mytask-v07-session';
let config=null, session=null, account=null, cloudRevision=0, remoteReady=false, dirty=false, saveTimer=null, syncing=false, syncAgain=false, cloudError='', authView='login', authMessage='', authBusy=false, remotePoll=null, conflict=false;
const DEFAULT_CONFIG={url:'https://yieamyshjtrwettnihji.supabase.co',key:'sb_publishable_navQOlEQsF0H25aRNU8sDg_aou63fLj'};
try{config=JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')}catch{}
if(!config)config=DEFAULT_CONFIG;
try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}
const initialEmpty=()=>({version:1,date:day(),groups:[],projects:[],tasks:[],today:[],tomorrow:[]});
const localPendingKey=()=>account?'mytask-v07-pending-'+account.id:null;
function validData(x){return !!x&&Array.isArray(x.groups)&&Array.isArray(x.projects)&&Array.isArray(x.tasks)&&Array.isArray(x.today)&&Array.isArray(x.tomorrow)&&typeof x.date==='string'}
function storeSession(s){session=s;if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
function setStatus(message,failed=false){cloudError=failed?message:'';const el=document.getElementById('syncstate');if(el){el.textContent=message;el.title=message;el.style.color=failed?'#b4494c':'#7b8595'}}
function apiHeaders(auth=true){const h={'apikey':config.key,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;return h}
async function api(path,opts={},useAuth=true){if(!config?.url||!config?.key)throw Error('接続設定がありません');const res=await fetch(config.url.replace(/\/$/,'')+path,{...opts,headers:{...apiHeaders(useAuth),...(opts.headers||{})}});let payload;const raw=await res.text();try{payload=raw?JSON.parse(raw):null}catch{payload=raw};if(!res.ok){const message=typeof payload==='object'?(payload?.msg||payload?.message||payload?.error_description||payload?.error):null;throw Error(message||'通信エラー ('+res.status+')')}return payload}
async function refreshSession(){if(!session?.refresh_token)return false;try{const next=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})},false);if(!next.access_token)throw Error('認証できません');storeSession({...next,expires_at:Math.floor(Date.now()/1000)+next.expires_in});return true}catch(e){return false}}
async function ensureSession(){if(!session?.access_token)throw Error('ログインしてください');if((session.expires_at||0)<Math.floor(Date.now()/1000)+65){if(!await refreshSession()){storeSession(null);account=null;remoteReady=false;renderAuth();throw Error('ログイン期限が切れました。もう一度ログインしてください')}}}
async function authenticatedApi(path,opts){await ensureSession();return api(path,opts)}
async function fetchRemote(){const rows=await authenticatedApi('/rest/v1/mytask_data?select=payload,revision&limit=1');return rows?.[0]||null}
async function startAccount(){account=session?.user;if(!account?.id){const user=await authenticatedApi('/auth/v1/user');account=user}remoteReady=false;renderAuth('データを読み込んでいます…');const row=await fetchRemote();const pending=localStorage.getItem(localPendingKey());if(pending){let cached;try{cached=JSON.parse(pending)}catch{}if(validData(cached?.payload)&&cached.baseRevision===(row?.revision||0)){db=cached.payload;cloudRevision=row?.revision||0;remoteReady=true;dirty=true;render();queueSync();return}conflict=true;cloudError='別端末の変更と未同期データが衝突しました。バックアップしてから復元してください。'}
if(row){if(!validData(row.payload))throw Error('保存データの形式が正しくありません');db=row.payload;cloudRevision=row.revision}else{db=initialEmpty();cloudRevision=0}dirty=false;remoteReady=true;render();if(cloudError)setStatus(cloudError,true);if(!remotePoll){remotePoll=setInterval(()=>{if(remoteReady&&!dirty&&!syncing&&!modal&&!conflict)checkRemote().catch(e=>setStatus('同期確認エラー: '+e.message,true))},12000)}}
async function checkRemote(){const row=await fetchRemote();if(!row||row.revision===cloudRevision)return;if(!validData(row.payload))throw Error('不正なクラウドデータ');db=row.payload;cloudRevision=row.revision;render();setStatus('同期済み')}
function queueSync(){if(!remoteReady||!account)return;dirty=true;localStorage.setItem(localPendingKey(),JSON.stringify({baseRevision:cloudRevision,payload:db}));setStatus('保存中…');clearTimeout(saveTimer);saveTimer=setTimeout(()=>{flushSync().catch(e=>setStatus('未同期：'+e.message,true))},450)}
async function flushSync(){if(syncing){syncAgain=true;return}if(!dirty||conflict||!remoteReady)return;syncing=true;syncAgain=false;const snapshot=JSON.stringify(db),expected=cloudRevision;try{await ensureSession();let rows;if(expected===0){rows=await api('/rest/v1/mytask_data',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:account.id,payload:JSON.parse(snapshot),revision:1})})}else{rows=await api('/rest/v1/mytask_data?user_id=eq.'+encodeURIComponent(account.id)+'&revision=eq.'+expected,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payload:JSON.parse(snapshot),revision:expected+1})})}if(!rows?.length){conflict=true;throw Error('別端末と編集が競合しました。JSONバックアップ後、再読み込みしてください')}cloudRevision=rows[0].revision;if(JSON.stringify(db)===snapshot){dirty=false;localStorage.removeItem(localPendingKey());setStatus('同期済み')}else{dirty=true;localStorage.setItem(localPendingKey(),JSON.stringify({baseRevision:cloudRevision,payload:db}));syncAgain=true}}catch(e){if(e.message.includes('duplicate key')||e.message.includes('already exists')){conflict=true;e=Error('別端末と編集が競合しました。JSONバックアップ後、再読み込みしてください')}setStatus('未同期：'+e.message,true)}finally{syncing=false;if(syncAgain&&!conflict){syncAgain=false;queueSync()}}}
function authLayout(body){document.getElementById('root').innerHTML=`<div class="authwrap"><div class="authcard"><div class="authbrand">まいタスク <small>v0.7</small></div>${body}</div></div>`}
function renderAuth(message=''){if(!config?.url||!config?.key){authLayout(`<h2>最初の接続設定</h2><p class="hint">SupabaseのプロジェクトURLと公開用キーを設定します。<strong>service_role / secretキーは絶対に入力しないでください。</strong></p><div class="field"><label>Project URL</label><input id="cfgUrl" type="url" placeholder="https://xxxxx.supabase.co" value="${safe(config?.url||'')}"></div><div class="field"><label>Publishable key または anon key</label><input id="cfgKey" placeholder="sb_publishable_... / eyJ..." value="${safe(config?.key||'')}"></div><button class="primary full" data-auth="configure">接続設定を保存</button><p class="hint">先に同梱の README と setup.sql の手順を済ませてください。</p>`);return}
if(message){authLayout(`<h2>まいタスク</h2><p class="hint">${safe(message)}</p>${cloudError?`<p class="autherror">${safe(cloudError)}</p>`:''}<button class="secondary full" data-auth="retry">再試行</button>`);return}
if(authView==='recovery'){authLayout(`<h2>新しいパスワード</h2><div class="field"><label>新しいパスワード（6文字以上）</label><input id="authPassword" type="password" autocomplete="new-password"></div><button class="primary full" data-auth="updatePassword">パスワードを変更</button><button class="secondary full" data-auth="loginView">戻る</button><p class="hint">${safe(authMessage)}</p>`);return}
let register=authView==='signup',reset=authView==='reset';authLayout(`<h2>${register?'新規登録':reset?'パスワードを再設定':'ログイン'}</h2><div class="field"><label>メールアドレス</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>${reset?'':`<div class="field"><label>パスワード</label><input id="authPassword" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="6"></div>`}<button class="primary full" data-auth="${reset?'reset':register?'signup':'login'}">${reset?'再設定メールを送信':register?'アカウント作成':'ログイン'}</button><div class="authlinks"><button data-auth="${register||reset?'loginView':'signupView'}">${register||reset?'ログインへ':'新規登録'}</button>${reset?'':`<button data-auth="resetView">パスワードを忘れた</button>`}</div><p class="authmessage">${safe(authMessage)}</p><button class="settingsLink" data-auth="settings">接続設定を変更</button>`)}
async function authAction(action){if(authBusy)return;authMessage='';try{if(action==='configure'){const url=document.getElementById('cfgUrl')?.value.trim().replace(/\/$/,'');const key=document.getElementById('cfgKey')?.value.trim();if(!/^https:\/\/[a-zA-Z0-9.-]+\.supabase\.co$/.test(url||''))throw Error('SupabaseのProject URLを入力してください');if(!key||key.length<20)throw Error('公開用キーを確認してください');config={url,key};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(config));storeSession(null);renderAuth();return}if(action==='settings'){if(!confirm('接続設定を変更するとログアウトします。よろしいですか？'))return;storeSession(null);account=null;remoteReady=false;config=null;localStorage.removeItem(CLOUD_CONFIG_KEY);renderAuth();return}
if(action==='loginView'||action==='signupView'||action==='resetView'){authView=action.replace('View','');renderAuth();return}if(action==='retry'){if(session)await startAccount();else renderAuth();return}
const email=document.getElementById('authEmail')?.value.trim();const password=document.getElementById('authPassword')?.value;if(action==='updatePassword'){if(!password||password.length<6)throw Error('6文字以上で入力してください');await authenticatedApi('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})});authView='login';storeSession(null);authMessage='パスワードを変更しました。ログインしてください';renderAuth();return}
if(!email)throw Error('メールアドレスを入力してください');authBusy=true;if(action==='reset'){await api('/auth/v1/recover',{method:'POST',body:JSON.stringify({email})},false);authMessage='再設定メールを送信しました。メールを確認してください';renderAuth();return}
if(!password||password.length<6)throw Error('パスワードは6文字以上で入力してください');let result;if(action==='signup'){result=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})},false);if(!result?.access_token){authView='login';authMessage='確認メールを送信しました。メール認証後にログインしてください';renderAuth();return}}else{result=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},false)}
storeSession({...result,expires_at:Math.floor(Date.now()/1000)+result.expires_in});await startAccount()}catch(e){authMessage=e.message;renderAuth()}finally{authBusy=false}}
async function logout(){if(dirty)await flushSync();if(dirty&&!confirm('未同期の変更が残っています。ログアウトしますか？'))return;try{await authenticatedApi('/auth/v1/logout',{method:'POST'})}catch{}storeSession(null);account=null;remoteReady=false;conflict=false;db=initialEmpty();authView='login';renderAuth()}
async function boot(){if(location.hash.includes('type=recovery')){const params=new URLSearchParams(location.hash.slice(1));const t=params.get('access_token'),r=params.get('refresh_token');if(t){storeSession({access_token:t,refresh_token:r,expires_at:Math.floor(Date.now()/1000)+Number(params.get('expires_in')||3600)});authView='recovery';history.replaceState(null,'',location.pathname+location.search);renderAuth();return}}
if(!config||!session){renderAuth();return}try{await ensureSession();await startAccount()}catch(e){authMessage=e.message;renderAuth()}}

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const day=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return day(d)};
const shortDate=s=>s?`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`:'';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starter=()=>{const groups=['研究','課題','バイト','就活'].map((name,i)=>({id:'g'+i,name,order:i}));const projects=[{id:'p1',groupId:'g0',name:'論文Aを読む',order:0,important:true,done:false,due:'',repeat:null},{id:'p2',groupId:'g0',name:'実験データを解析する',order:1,done:false,due:'',repeat:null},{id:'p3',groupId:'g2',name:'数学テストを作る',order:0,done:false,due:'',repeat:null}];const tasks=[{id:'t1',projectId:'p1',name:'Abstractを読む',order:0,important:true,done:false,due:''},{id:'t2',projectId:'p1',name:'Introductionを読む',order:1,done:false,due:''},{id:'t3',projectId:'p1',name:'Methodを読む',order:2,done:false,due:''},{id:'t4',projectId:'p2',name:'データを整理する',order:0,done:false,due:''},{id:'t5',projectId:'p3',name:'解答を作成する',order:0,done:false,due:''}];return{version:1,date:day(),groups,projects,tasks,today:['t1','p3'],tomorrow:['t2']}};

let page='today',groupId=null,projectId=null,modal=null,toastMsg='',dragSource=null,animateNextView=false;
const reducedMotion=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
const groupSort=(a,b)=>a.order-b.order;const projectsIn=g=>db.projects.filter(p=>p.groupId===g).sort(groupSort);const tasksIn=p=>db.tasks.filter(t=>t.projectId===p).sort(groupSort);const project=id=>db.projects.find(p=>p.id===id);const group=id=>db.groups.find(g=>g.id===id);
function allItems(){const r=[];for(const g of [...db.groups].sort(groupSort)){for(const p of projectsIn(g.id)){r.push({id:p.id,name:p.name,kind:'project',group:g,project:p,item:p});for(const t of tasksIn(p.id))r.push({id:t.id,name:t.name,kind:'task',group:g,project:p,item:t})}}return r}
function cycle(){let delta=0;while(db.date<day()&&delta<1500){db.today=[...new Set([...db.today,...db.tomorrow])].filter(id=>{const it=lookup(id);return it&&!it.done});db.tomorrow=[];db.date=addDays(db.date,1);delta++}if(delta){save(false)}}
const lookup=id=>db.projects.find(x=>x.id===id)||db.tasks.find(x=>x.id===id);
function scheduleRepeat(){const today=day();let changed=false;for(const p of [...db.projects]){if(!p.repeat?.freq||p.repeat?.templateId)continue;let r=p.repeat;if(!r.next)r.next=addDays(today,1);let guard=0;while(r.next<=today&&guard++<500){const scheduled=r.next;const clone={id:uid(),groupId:p.groupId,name:p.name+'（'+shortDate(scheduled)+'）',order:projectsIn(p.groupId).length,done:false,important:!!p.important,due:'',repeat:null};db.projects.push(clone);for(const t of tasksIn(p.id).filter(t=>r.childIds?.includes(t.id)))db.tasks.push({id:uid(),projectId:clone.id,name:t.name,order:tasksIn(clone.id).length,done:false,important:!!t.important,due:''});r.next=nextDate(r.next,r.freq);changed=true}}if(changed)save(false)}
function nextDate(date,freq){const d=new Date(date+'T12:00:00');if(freq==='daily')d.setDate(d.getDate()+1);else if(freq==='weekly')d.setDate(d.getDate()+7);else if(freq==='monthly')d.setMonth(d.getMonth()+1);else if(freq==='yearly')d.setFullYear(d.getFullYear()+1);return day(d)}

function top(title,subtitle='',back=''){return `<div class="top"><div>${back?`<button class="back" data-action="back">‹ 戻る</button>`:''}<h1 class="title">${safe(title)}</h1><div class="sub">${safe(subtitle)}</div></div></div>`}
function renderToday(){const items=allItems().filter(x=>db.today.includes(x.id));const undone=items.filter(x=>!x.item.done),done=items.filter(x=>x.item.done);let html=top('今日のタスク',new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'}));html+=`<p class="progress">残りタスク <strong>${undone.length}/${items.length}</strong></p>`;if(!items.length)html+='<div class="empty">今日のタスクはありません。<br>「今日・明日の予定」から追加できます。</div>';if(items.length&&!undone.length)html+='<div class="empty">今日のタスクをすべて完了しました ✓</div>';let prev='';for(const x of undone){if(x.group.name!==prev){html+=`<div class="grouphead">${safe(x.group.name)}</div>`;prev=x.group.name}html+=taskCard(x)}if(done.length)html+='<div class="section">完了済み</div>';for(const x of done)html+=taskCard(x);return html}
function taskCard(x){return `<div class="item ${x.item.done?'completed':''}" data-today-id="${safe(x.id)}"><input class="check" aria-label="${safe(x.name)}の完了" type="checkbox" data-action="complete" data-id="${x.id}" ${x.item.done?'checked':''}><div class="textpart"><div class="name">${safe(x.name)}</div><div class="meta">${safe(x.group.name)} / ${safe(x.project.name)}${x.item.due?' ・ 納期 '+shortDate(x.item.due):''}</div></div><button class="starbtn ${x.item.important?'on':''}" data-action="star" data-id="${x.id}" title="重要度を切り替え" aria-label="${x.item.important?'重要を解除':'重要にする'}" aria-pressed="${!!x.item.important}">${x.item.important?'★':'☆'}</button></div>`}
function card(p,kind){const type=kind==='group'?'group':kind==='project'?'project':'task';const nm=p.name;const due=p.due?'納期 '+shortDate(p.due):'';const repeat=p.repeat?.freq?' ・ 繰り返し':'';return `<div class="item ${p.done?'completed':''}" data-item-id="${p.id}" data-kind="${type}" draggable="true"><span class="handle" title="ドラッグして順番変更">⠿</span>${type==='group'?'':`<input class="check" aria-label="完了" type="checkbox" data-action="complete" data-id="${p.id}" ${p.done?'checked':''}>`}<div class="clickarea" data-action="open" data-kind="${type}" data-id="${p.id}"><div class="textpart"><div class="name">${safe(nm)}</div>${due||repeat?`<div class="meta">${safe(due+repeat)}</div>`:''}</div></div>${type==='group'?'':`<button class="starbtn ${p.important?'on':''}" data-action="star" data-id="${p.id}" title="重要度を切り替え" aria-label="${p.important?'重要を解除':'重要にする'}" aria-pressed="${!!p.important}">${p.important?'★':'☆'}</button>`}<button class="iconbtn" data-action="edit" data-kind="${type}" data-id="${p.id}" aria-label="その他">···</button></div>`}
function completedLastCards(items,kind){const active=items.filter(x=>!x.done),finished=items.filter(x=>x.done);return active.map(x=>card(x,kind)).join('')+(finished.length?'<div class="section">完了済み</div>'+finished.map(x=>card(x,kind)).join(''):'')}
function renderProjects(){if(!groupId)return top('タスク一覧','グループを選択してください')+'<button class="secondary" style="margin-bottom:17px" data-action="newGroup">＋ グループを追加</button>'+db.groups.slice().sort(groupSort).map(g=>card(g,'group')).join('')+(db.groups.length?'':'<div class="empty">グループがありません。「グループを追加」から作れます。</div>');let g=group(groupId);if(!g){groupId=null;return renderProjects()}if(!projectId)return top(g.name,'タスク',true)+'<button class="secondary quickadd" data-action="newTask">＋ タスクを追加</button>'+completedLastCards(projectsIn(g.id),'project')+(!projectsIn(g.id).length?'<div class="empty">タスクがありません。「タスクを追加」から作成できます。</div>':'');const p=project(projectId);if(!p){projectId=null;return renderProjects()}return top(p.name,'サブタスク',true)+'<button class="secondary quickadd" data-action="newSubtask">＋ サブタスクを追加</button>'+`<div class="notice">このタスクの完了や納期、繰り返しの設定は、前の画面の「···」から編集できます。</div>`+completedLastCards(tasksIn(p.id),'task')+(!tasksIn(p.id).length?'<div class="empty">サブタスクはありません。タスク単体でも完了できます。</div>':'')}
function renderPlan(){let html=top('今日・明日の予定');html+='<div class="planhead"><span>タスク</span><span>今日</span><span>明日</span></div>';let prev='';for(const x of allItems()){if(x.item.done)continue;if(prev!==x.group.id){prev=x.group.id;html+=`<div class="grouphead">${safe(x.group.name)}</div>`}html+=`<div class="planrow ${x.kind==='task'?'child':''}"><div class="plabel"><div class="name" style="font-size:13px;font-weight:${x.kind==='project'?700:450}">${safe(x.name)}${x.item.important?' <span style="color:#e4a72f" aria-label="重要">★</span>':''}</div>${x.kind==='task'?`<div class="small">${safe(x.project.name)}</div>`:''}</div><input class="check" type="checkbox" aria-label="今日に追加" data-action="plan" data-date="today" data-id="${x.id}" ${db.today.includes(x.id)?'checked':''}><input class="check" type="checkbox" aria-label="明日に追加" data-action="plan" data-date="tomorrow" data-id="${x.id}" ${db.tomorrow.includes(x.id)?'checked':''}></div>`}return html+'<div class="notice">日付が変わると「明日」のチェックは「今日」に移動します。「今日」の未完了タスクは翌日も残ります。</div>'}

function editModal(){if(!modal)return '';if(modal.mode==='backup')return `<div class="overlay"><div class="modal"><h2>バックアップ</h2><p class="hint">JSONファイルにすべてのタスクと設定を保存できます。復元すると現在のデータが置き換わります。</p><button class="secondary" data-action="export">データを書き出す</button>${localStorage.getItem(KEY)?`<p class="hint">旧版のデータがこの端末にあります。</p><button class="secondary" data-action="localMigration">旧版v0.6のデータをクラウドへ移す</button>`:''}${conflict?`<p class="autherror">未同期データが競合しています。書き出してからクラウドを再読み込みしてください。</p><button class="secondary" data-action="reloadCloud">クラウドから再読み込み</button>`:''}<div class="field" style="margin-top:18px"><label>バックアップから復元</label><input id="importFile" type="file" accept=".json,application/json"></div><div class="modalfooter"><button class="secondary" data-action="close">閉じる</button><button class="primary" data-action="import">復元する</button></div></div></div>`;

const editing=modal.mode==='edit',it=editing?(modal.kind==='group'?group(modal.id):lookup(modal.id)):null;const kind=modal.kind;const grp=editing?(kind==='group'?modal.id:kind==='project'?it.groupId:project(it.projectId)?.groupId):modal.prefGroup||db.groups[0]?.id||'';const pid=editing&&kind==='task'?it.projectId:(modal.prefProject||'');const type=kind==='group'?'グループ':kind==='project'?'タスク':'サブタスク';

if(kind!=='group')inner+=`<div class="field"><label>グループ（必須）</label><select id="formGroup">${options([...db.groups].sort(groupSort),grp,'選択してください')}</select></div><div class="field"><label>タスク（${kind==='task'?'親タスク':'未選択なら新しいタスク'}）</label><select id="formProject">${options(projectsIn(grp),pid,'指定しない（新しいタスク）')}</select></div><div class="field"><label>納期（任意）</label><input id="formDue" type="date" value="${safe(it?.due||'')}"></div>`;

function render(){if(!remoteReady){renderAuth();return}const previousScroll=document.querySelector('.main-scroll')?.scrollTop||0;cycle();scheduleRepeat();const inner=page==='today'?renderToday():page==='projects'?renderProjects():renderPlan();const enter=animateNextView&&!reducedMotion();const resetScroll=animateNextView;animateNextView=false;const boundary='</div></div></div>';const cut=inner.indexOf(boundary);if(cut<0)throw Error('画面のヘッダーが見つかりません');const head=inner.slice(0,cut+boundary.length),body=inner.slice(cut+boundary.length);document.getElementById('root').innerHTML=`<div class="shell">${nav()}<main class="main ${enter?'view-enter':''}"><div class="main-header">${head}</div><div class="main-scroll" tabindex="0" aria-label="タスク一覧のスクロール領域">${body}</div></main></div>${modal?editModal():''}${toastMsg?`<div id="toast" class="toast">${safe(toastMsg)}</div>`:''}`;const scroller=document.querySelector('.main-scroll');if(scroller&&!resetScroll)scroller.scrollTop=previousScroll;if(modal?.mode==='edit'||modal?.mode==='add')bindForm()}
// FLIP: capture old rectangles, then animate new positions using compositor transforms.
function captureRects(selector){const out=new Map();document.querySelectorAll(selector).forEach(el=>{const key=el.dataset.todayId||el.dataset.itemId;if(key)out.set(key,el.getBoundingClientRect())});return out}
function animateReflow(before,selector,keyAttr){if(reducedMotion())return;document.querySelectorAll(selector).forEach(el=>{const old=before.get(el.dataset[keyAttr]);if(!old)return;const now=el.getBoundingClientRect();const dx=old.left-now.left,dy=old.top-now.top;if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:340,easing:'cubic-bezier(.22,1,.36,1)'});})}
function completeWithMotion(id,isDone){const it=lookup(id);if(!it)return;const wasToday=page==='today',wasProjects=page==='projects';const rects=wasToday?captureRects('[data-today-id]'):wasProjects?captureRects('[data-item-id]'):null;it.done=isDone;if(isDone)db.tomorrow=db.tomorrow.filter(x=>x!==id);save(false);render();if(rects)animateReflow(rects,wasToday?'[data-today-id]':'[data-item-id]',wasToday?'todayId':'itemId')}
function toggleStarWithMotion(button,id){const it=lookup(id);if(!it)return;it.important=!it.important;save(false);button.textContent=it.important?'★':'☆';button.classList.toggle('on',!!it.important);button.setAttribute('aria-pressed',String(!!it.important));button.setAttribute('aria-label',it.important?'重要を解除':'重要にする');button.classList.remove('star-pop');void button.offsetWidth;if(!reducedMotion())button.classList.add('star-pop')}

function syncRepeat(){const enabled=!!document.getElementById('formRepeat')?.value;document.querySelectorAll('.repeat-extra').forEach(el=>el.classList.toggle('hide',!enabled))}
function bindForm(){const gs=document.getElementById('formGroup'),ps=document.getElementById('formProject');const sync=()=>{if(!gs||!ps)return;const curr=ps.value;ps.innerHTML=options(projectsIn(gs.value).filter(p=>p.id!==modal?.id),curr,'指定しない（新しいタスク）');if(!projectsIn(gs.value).some(p=>p.id===curr))ps.value='';const sect=document.getElementById('repeatSection');if(sect)sect.classList.toggle('hide',!!ps.value);syncRepeat()};gs?.addEventListener('change',sync);ps?.addEventListener('change',sync);document.getElementById('formRepeat')?.addEventListener('change',syncRepeat);sync()}
function saveForm(){const name=document.getElementById('formName')?.value.trim();if(!name){alert('件名を入力してください');return}const isEdit=modal.mode==='edit',kind=modal.kind;const gs=document.getElementById('formGroup')?.value,ps=document.getElementById('formProject')?.value,due=document.getElementById('formDue')?.value||'';let value;if(kind==='group'){if(isEdit)group(modal.id).name=name;else db.groups.push({id:uid(),name,order:db.groups.length})}else{if(!gs||!group(gs)){alert('グループを選んでください');return}if(!ps){if(kind==='task'&&!isEdit){alert('親タスクを選択してください');return}if(isEdit&&kind==='task'){alert('サブタスクをタスクへ変更する場合は新規作成してください');return}const old=isEdit?project(modal.id):null;const f=document.getElementById('formRepeat')?.value||'';const next=document.getElementById('formNext')?.value||addDays(day(),1);const selected=isEdit?[...document.querySelectorAll('[data-repeat-child]:checked')].map(n=>n.dataset.repeatChild):[];value={name,groupId:gs,due,repeat:f?{freq:f,next,childIds:selected}:null};if(old)Object.assign(old,value);else db.projects.push({id:uid(),order:projectsIn(gs).length,done:false,important:false,...value});}else{if(kind==='project'&&!isEdit){alert('新しいタスクを作成する場合はタスク欄を空にしてください');return}if(!project(ps)||project(ps).groupId!==gs){alert('タスクを確認してください');return}if(isEdit&&kind==='project'){alert('タスクをサブタスクへ変更する場合は新規作成してください');return}value={name,projectId:ps,due};if(isEdit)Object.assign(lookup(modal.id),value);else db.tasks.push({id:uid(),order:tasksIn(ps).length,done:false,important:false,...value})}}modal=null;save();notify('保存しました')}
function deleteItem(){const {id,kind}=modal;const ids=[];if(kind==='group'){const ps=db.projects.filter(p=>p.groupId===id).map(p=>p.id);ids.push(...ps,...db.tasks.filter(t=>ps.includes(t.projectId)).map(t=>t.id));db.groups=db.groups.filter(g=>g.id!==id);db.projects=db.projects.filter(p=>p.groupId!==id);db.tasks=db.tasks.filter(t=>!ps.includes(t.projectId));groupId=null;projectId=null}else if(kind==='project'){ids.push(id,...tasksIn(id).map(t=>t.id));db.projects=db.projects.filter(p=>p.id!==id);db.tasks=db.tasks.filter(t=>t.projectId!==id);projectId=null}else{ids.push(id);db.tasks=db.tasks.filter(t=>t.id!==id)}db.today=db.today.filter(id=>!ids.includes(id));db.tomorrow=db.tomorrow.filter(id=>!ids.includes(id));for(const p of db.projects)if(p.repeat)p.repeat.childIds=p.repeat.childIds.filter(id=>!ids.includes(id));modal=null;save();notify('削除しました')}
function reorder(src,dst){if(src===dst)return;const source=lookup(src)||group(src),target=lookup(dst)||group(dst);if(!source||!target)return;const kind=db.groups.includes(source)?'group':db.projects.includes(source)?'project':'task';const same=kind==='group'?db.groups.includes(target):kind==='project'?db.projects.includes(target)&&source.groupId===target.groupId:db.tasks.includes(target)&&source.projectId===target.projectId;if(!same)return;const arr=kind==='group'?db.groups:kind==='project'?projectsIn(source.groupId):tasksIn(source.projectId);const ordered=[...arr].sort(groupSort);const s=ordered.findIndex(x=>x.id===src),t=ordered.findIndex(x=>x.id===dst);const [it]=ordered.splice(s,1);ordered.splice(t,0,it);ordered.forEach((x,i)=>x.order=i);save()}
function exportFile(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mytask-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function handle(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;switch(a){case'nav':page=el.dataset.page;groupId=null;projectId=null;animateNextView=true;render();break;case'back':if(projectId)projectId=null;else groupId=null;animateNextView=true;render();break;case'open':if(el.dataset.kind==='group'){groupId=id;projectId=null}else if(el.dataset.kind==='project'){projectId=id}animateNextView=true;render();break;case'star':toggleStarWithMotion(el,id);break;case'complete':completeWithMotion(id,el.checked);break;case'plan':{const k=el.dataset.date;if(el.checked)db[k]=[...new Set([...db[k],id])];else db[k]=db[k].filter(x=>x!==id);save()}break;case'add':modal={mode:'add',kind:'project',prefGroup:groupId||db.groups[0]?.id,prefProject:''};render();break;case'edit':modal={mode:'menu',kind:el.dataset.kind,id};render();break;case'menuEdit':modal.mode='edit';render();break;case'menuDelete':modal.mode='delete';render();break;case'close':modal=null;render();break;case'deleteConfirm':deleteItem();break;case'saveForm':saveForm();break;case'backup':modal={mode:'backup'};render();break;case'logout':logout();break;case'reloadCloud':if(confirm('クラウドのデータで現在の画面を再読み込みします。未同期の編集内容は失われます。JSONバックアップを先に保存してください。')){dirty=false;conflict=false;localStorage.removeItem(localPendingKey());startAccount().catch(e=>alert(e.message))}break;case'localMigration':{if(!confirm('このMacの旧バージョンにあるタスクデータで、現在のクラウドデータを上書きします。先にJSONバックアップしてください。'))break;try{const old=JSON.parse(localStorage.getItem(KEY));if(!validData(old))throw Error('旧データが見つかりません');db=old;modal=null;save();notify('旧データを同期しています')}catch(e){alert(e.message)}break}case'export':exportFile();break;case'import':{const f=document.getElementById('importFile')?.files?.[0];if(!f){alert('復元するJSONファイルを選択してください');break}if(!confirm('現在のデータをバックアップの内容で置き換えます。よろしいですか？'))break;f.text().then(t=>{try{const x=JSON.parse(t);if(!Array.isArray(x.groups)||!Array.isArray(x.projects)||!Array.isArray(x.tasks)||!Array.isArray(x.today)||!Array.isArray(x.tomorrow))throw Error();db=x;db.date=day();modal=null;groupId=null;projectId=null;save();notify('復元しました')}catch{alert('バックアップファイルの形式が正しくありません')}})}break;case'newGroup':modal={mode:'add',kind:'group'};render();break;case'newTask':modal={mode:'add',kind:'project',prefGroup:groupId,prefProject:''};render();break;case'newSubtask':modal={mode:'add',kind:'task',prefGroup:groupId,prefProject:projectId};render();break;}}
// Add form type logic: a project is created if no project selected; a small task otherwise.
document.addEventListener('click',e=>{const auth=e.target.closest('[data-auth]');if(auth){authAction(auth.dataset.auth);return}if(!remoteReady)return;if(e.target.closest('.overlay')===e.target){modal=null;render()}else if(e.target.closest('button[data-action="add"]')&&page==='projects'&&!groupId){/* use quick add */}else if(!e.target.matches('input[data-action="complete"],input[data-action="plan"]'))handle(e)});
document.addEventListener('change',e=>{if(e.target.matches('input[data-action="complete"],input[data-action="plan"]'))handle(e)});
// Live reorder: move the card as the cursor crosses another card's midpoint.
// This works in both directions; committing the DOM order on drop avoids
// relying on the exact row that happens to be under the pointer at mouse release.
let dragElement=null,dragMoved=false,pointerDrag=null;
function dragCompatible(a,b){return !!(a&&b&&a!==b&&a.dataset.kind===b.dataset.kind)}
function moveDragged(source,target,clientY){
  if(!dragCompatible(source,target))return;
  const box=target.getBoundingClientRect();
  const after=clientY>=box.top+box.height/2;
  if(after&&target.nextElementSibling===source)return;
  if(!after&&target.previousElementSibling===source)return;
  const before=captureRects('.item[data-item-id]');
  if(after)target.after(source);else target.before(source);
  // Keep the card under the pointer; slide the neighboring cards into their new slots.
  if(!reducedMotion())document.querySelectorAll('.item[data-item-id]').forEach(el=>{
    if(el===source)return;
    const old=before.get(el.dataset.itemId);if(!old)return;
    const now=el.getBoundingClientRect();const dy=old.top-now.top;
    if(Math.abs(dy)>.5)el.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:210,easing:'cubic-bezier(.22,1,.36,1)'});
  });
  dragMoved=true;
}
function commitDragged(source){
  if(!source||!dragMoved)return;
  const kind=source.dataset.kind;
  const items=[...document.querySelectorAll('.item[data-item-id][data-kind="'+kind+'"]')];
  const ids=items.map(el=>el.dataset.itemId);
  const lookupList=kind==='group'?db.groups:kind==='project'?projectsIn(groupId):tasksIn(projectId);
  const byId=new Map(lookupList.map(el=>[el.id,el]));
  ids.forEach((id,i)=>{if(byId.has(id))byId.get(id).order=i});
  save();
}
function finishDrag(commit){
  const source=dragElement;
  if(source){source.classList.remove('dragging');if(commit)commitDragged(source);else render()}
  dragElement=null;dragMoved=false;
}
document.addEventListener('dragstart',e=>{
  const item=e.target.closest('.item[draggable]');if(!item)return;
  dragElement=item;dragMoved=false;item.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  // Safari needs an explicit payload for consistent HTML5 drag events.
  e.dataTransfer.setData('text/plain',item.dataset.itemId);
});
document.addEventListener('dragover',e=>{
  if(!dragElement)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const target=e.target.closest('.item[data-item-id]');
  if(target)moveDragged(dragElement,target,e.clientY);
});
document.addEventListener('drop',e=>{if(!dragElement)return;e.preventDefault();finishDrag(true)});
document.addEventListener('dragend',()=>{if(dragElement)finishDrag(false)});
// On touchscreens, use the grip for live dragging while keeping card scrolling intact.
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  const grip=e.target.closest('.handle');const item=grip?.closest('.item[data-item-id]');
  if(!item)return;
  pointerDrag={item,grip,pointerId:e.pointerId,startY:e.clientY,active:false};
  grip.setPointerCapture?.(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  const d=pointerDrag;if(!d||d.pointerId!==e.pointerId)return;
  if(!d.active){if(Math.abs(e.clientY-d.startY)<6)return;d.active=true;dragElement=d.item;dragMoved=false;d.item.classList.add('dragging')}
  e.preventDefault();
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.item[data-item-id]');
  if(target)moveDragged(d.item,target,e.clientY);
});
document.addEventListener('pointerup',e=>{if(!pointerDrag||pointerDrag.pointerId!==e.pointerId)return;if(pointerDrag.active)finishDrag(true);pointerDrag=null});
document.addEventListener('pointercancel',()=>{if(pointerDrag?.active)finishDrag(false);pointerDrag=null});
// Long-running dates and recurrence are refreshed when the tab becomes visible.
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('focus',()=>render());
try{boot()}catch(e){document.getElementById('root').innerHTML='<h2>読み込みエラー</h2><pre style="white-space:pre-wrap">'+safe(e.message)+'</pre>';console.error(e)}
})();
